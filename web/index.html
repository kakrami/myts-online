<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#12221b" />
    <title>myTS</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="app">
      <header>
        <a class="brand" href="/">my<span>TS</span><small>7.0.1</small></a>
        <div class="top-actions">
          <button
            id="search-open"
            class="icon"
            aria-label="Find a team"
          ></button
          ><button
            id="settings-open"
            class="icon"
            aria-label="Settings"
          ></button>
        </div>
      </header>
      <div id="context" hidden>
        <select id="team-picker" aria-label="Your team"></select
        ><select id="season-picker" aria-label="Season"></select>
      </div>
      <nav id="nav" hidden aria-label="Main views"></nav>
      <main id="root" aria-live="polite">
        <div class="empty">Loading myTS…</div>
      </main>
    </div>
    <dialog id="sheet">
      <div class="sheet-head">
        <button id="sheet-back" class="icon" aria-label="Back" hidden></button>
        <h2 id="sheet-title"></h2>
        <div id="sheet-actions"></div>
        <button id="sheet-close" class="icon" aria-label="Close"></button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
    <div id="busy" hidden aria-label="Loading"></div>
  </body>
</html>
